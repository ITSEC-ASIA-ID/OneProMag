# OneProMag — production stack
#
# Runs with NO configuration at all:
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# `name:` gives this stack its own compose project, and therefore its own
# volumes. Without it compose derives the project from the directory name — the
# same name docker-compose.yml gets — so both files would mount the SAME Postgres
# volume, and a database that was seeded with demo fixtures during development
# would follow you into production. SEED_DEMO=0 stops new fixtures; it cannot
# un-seed rows that are already there. Separate volumes make "production" a
# genuinely empty install and leave the development data where it belongs.
#
# Consequence: the two stacks no longer share data, and both publish 3131, so
# stop one before starting the other. To copy real content from dev to prod, see
# Database → Migrating between stacks in the README.
name: onepromag-prod
#
# The app is published on ${APP_PORT:-3131}, exactly like the development file,
# so the address you have been using keeps working. What is different from
# docker-compose.yml is that this file is meant to stay up unattended:
#
#   * restart: unless-stopped on every service, so a reboot brings it back;
#   * init: true, so SIGTERM reaches node and it closes the listener instead of
#     being killed after the 10 second grace period;
#   * healthchecks that ask /healthz (which round-trips to Postgres) rather than
#     just "did the process start";
#   * the app runs read-only with no capabilities and no new privileges;
#   * logs are capped at 10 MB × 3 per service, instead of filling the disk;
#   * the database publishes nothing — it is reachable as `db` on the compose
#     network and from nowhere else.
#
# TLS is opt-in, because it needs something no file can invent: a hostname that
# resolves to this machine. When you have one:
#
#   # .env
#   DOMAIN=onepromag.example.com
#   ACME_EMAIL=you@example.com
#   POSTGRES_PASSWORD=<openssl rand -base64 24>
#   APP_BIND=127.0.0.1            # the proxy is the only way in
#   COOKIE_SECURE=1
#
#   docker compose -f docker-compose.prod.yml --profile tls up -d --build
#
# Without a domain, Caddy cannot obtain a certificate, so there is nothing to
# switch on — the app stays on http, which is why the session cookie only gets
# `Secure` when the request actually arrives over TLS (see server/auth.js).

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    init: true
    networks: [onepromag-net]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-onepromag}
      POSTGRES_USER: ${POSTGRES_USER:-onepromag}
      # Kept with a default so the file runs with one command; the app prints a
      # warning in its boot log while it is still this value.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onepromag}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      - onepromag-pgdata:/var/lib/postgresql/data
    # Postgres uses shared memory for parallel queries; the Docker default of
    # 64 MB is the usual cause of "could not resize shared memory segment".
    shm_size: 256mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-onepromag} -d ${POSTGRES_DB:-onepromag}']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    security_opt: ['no-new-privileges:true']
    logging: &logging
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  onepromag:
    build: .
    image: onepromag:latest
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    networks: [onepromag-net]
    environment:
      NODE_ENV: production
      PORT: 3131
      HOST: 0.0.0.0
      DB: postgres
      # No fixtures. A fresh database gets the schema, the built-in
      # categories/statuses and a single admin account — nothing with a fake
      # client name on it. Set SEED_DEMO=1 only for a throwaway demo box.
      SEED_DEMO: ${SEED_DEMO:-0}
      # Public self-registration is off: accounts come from an admin or the import.
      # Set ALLOW_REGISTER=1 only for a throwaway demo box.
      ALLOW_REGISTER: ${ALLOW_REGISTER:-0}
      # The bootstrap admin (used only while the users table is empty).
      # Without ADMIN_PASSWORD a random one is generated and printed once in
      # the boot log.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-onepromag}
      PGPASSWORD: ${POSTGRES_PASSWORD:-onepromag}
      PGDATABASE: ${POSTGRES_DB:-onepromag}
      TZ: ${TZ:-Asia/Jakarta}
      # Empty means "decide from the request": Secure only over https. Set it to
      # 1 or 0 only when that guess has to be overruled.
      COOKIE_SECURE: ${COOKIE_SECURE:-}
    ports:
      - '${APP_BIND:-0.0.0.0}:${APP_PORT:-3131}:3131'
    # The image writes only to /tmp and (for the SQLite fallback) /data, so the
    # rest of the filesystem can be read-only. A future feature that writes to
    # disk then fails loudly here instead of quietly filling the container layer.
    read_only: true
    tmpfs:
      - /tmp:size=32m
    volumes:
      - onepromag-data:/data
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test:
        ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3131/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 30s
    logging: *logging

  # TLS, opt-in: needs DOMAIN, ACME_EMAIL and ports 80/443. See the header.
  proxy:
    image: caddy:2-alpine
    profiles: ['tls']
    restart: unless-stopped
    init: true
    depends_on:
      onepromag:
        condition: service_started
    networks: [onepromag-net]
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      # Compose interpolates every service in the file, profiles or not, so this
      # cannot be a required variable — that would break the no-.env run. The
      # default is `localhost`, which Caddy serves with its own internal CA,
      # i.e. a self-signed certificate for testing the profile locally. Set a
      # real hostname in .env to get a Let's Encrypt certificate.
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and the ACME account key. Losing this volume re-issues every
      # certificate, which can hit Let's Encrypt rate limits — never a tmpfs.
      - onepromag-caddy:/data
      - onepromag-caddy-config:/config
    security_opt: ['no-new-privileges:true']
    logging: *logging

  # Nightly logical backups.
  #
  # Not behind a profile any more, on purpose. `up -d --build` is the command the
  # README gives, and a backup service that only exists when you remember a flag
  # is a backup that does not exist: the first symptom is a corrupt volume and no
  # dump to restore. It costs one idle container, restarts with the stack, and
  # logs a line per run.
  #
  #   mkdir -p backups
  #   docker compose -f docker-compose.prod.yml up -d
  # Restores with the command in the README (Database → Backups).
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    networks: [onepromag-net]
    # The dump lands in ./backups on the host, so the container writes as the
    # user who owns it: HOST_UID/HOST_GID from `id -u`/`id -g`. Root would leave
    # files you cannot delete without sudo, hence the 0:0 fallback.
    user: '${HOST_UID:-0}:${HOST_GID:-0}'
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-onepromag}
      PGPASSWORD: ${POSTGRES_PASSWORD:-onepromag}
      PGDATABASE: ${POSTGRES_DB:-onepromag}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      - ./backups:/backups
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        # `pipefail` is the whole point of this line: without it the `if` below
        # tests GZIP's exit status, so a failed pg_dump (database locked, still
        # starting, mid-upgrade) produced a valid 20-byte .sql.gz, renamed it
        # into place, printed success — and then the prune deleted the last real
        # dump. Verified against postgres:17-alpine: without pipefail the shell
        # says SUCCESS over a 20-byte file.
        set -euo pipefail
        # A dump smaller than this is not a dump. `pg_dump` with no schema still
        # emits a few kB of SET/comment lines, so 10 kB is far below any real
        # database and far above an empty one.
        MIN_DUMP_BYTES=10000
        # `$$` is a literal `$` in compose: these are shell variables read from
        # the container's own environment, not values substituted at parse time.
        echo "backup: writing to /backups every $${BACKUP_INTERVAL_SECONDS}s, keeping $${KEEP_DAYS} days"
        while :; do
          stamp=$$(date +%Y-%m-%d-%H%M)
          out="/backups/onepromag-$$stamp.sql.gz"
          if pg_dump --no-owner --no-privileges | gzip -9 > "$$out.part" \
             && [ "$$(gzip -dc "$$out.part" | wc -c)" -ge "$$MIN_DUMP_BYTES" ]; then
            mv "$$out.part" "$$out"
            echo "backup: $$out ($$(du -h "$$out" | cut -f1))"
          else
            # Left behind as evidence, renamed so a prune can never keep it as if
            # it were a backup.
            mv -f "$$out.part" "/backups/failed-$$stamp.sql.gz" 2>/dev/null || true
            echo "backup: FAILED at $$stamp — previous dumps kept" >&2
          fi
          find /backups -name 'onepromag-*.sql.gz' -mtime +"$$KEEP_DAYS" -delete
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done
    security_opt: ['no-new-privileges:true']
    logging: *logging

networks:
  onepromag-net:
    driver: bridge
    ipam:
      config:
        # Different default from docker-compose.yml (10.77.0.0/24) on purpose:
        # two stacks on one host would otherwise fight over the same subnet when
        # both are up.
        - subnet: ${ONEPROMAG_SUBNET:-10.78.0.0/24}

volumes:
  onepromag-pgdata:
  onepromag-data:
  onepromag-caddy:
  onepromag-caddy-config:
